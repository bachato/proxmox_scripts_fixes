#cloud-config
# Generated by cloud-init/tools/render_profiles.py; edit the template, not this file.
# Profile: Debian 13 with Docker

output:
  all: "| tee -a /var/log/cloud-init-output.log"
final_message: "cloud-init modules finished after $UPTIME seconds; check cloud-init status --long"

preserve_hostname: false
manage_etc_hosts: true
timezone: America/Chicago

ssh_pwauth: false
disable_root: true

users:
  - name: admin
    gecos: Admin
    groups: [adm, sudo]
    shell: /bin/bash
    sudo: ALL=(ALL) NOPASSWD:ALL
    lock_passwd: true

# The cloud-init mounts module is the sole owner of this mount. bootcmd only
# validates or creates the filesystem so the same target cannot be mounted twice.
mounts:
  - [LABEL=APPDATA, /mnt/appdata, ext4, "defaults,noatime,x-systemd.growfs,nodev,x-systemd.device-timeout=30s", "0", "2"]

bootcmd:
  - |
    set -eu

    marker=/var/lib/cloud/instance/sem/appdata-provisioned
    [ -e "$marker" ] && exit 0

    app_link=/dev/disk/by-id/wwn-0x2000000000000001
    udevadm settle
    [ -L "$app_link" ] || {
      echo "APPDATA disk is missing: expected $app_link" >&2
      exit 1
    }

    app_dev="$(readlink -f "$app_link")"
    [ -b "$app_dev" ] || {
      echo "APPDATA target is not a block device: $app_dev" >&2
      exit 1
    }

    app_serial="$(lsblk -dn -o SERIAL "$app_dev" | xargs)"
    [ "$app_serial" = APPDATA ] || {
      echo "APPDATA serial mismatch on $app_dev: $app_serial" >&2
      exit 1
    }

    root_source="$(findmnt -n -o SOURCE /)"
    root_chain="$(lsblk -s -n -o PATH "$root_source")" || {
      echo "Could not inspect the root filesystem device chain" >&2
      exit 1
    }
    if printf '%s\n' "$root_chain" | grep -Fxq -- "$app_dev"; then
      echo "Refusing to format a device in the root filesystem chain: $app_dev" >&2
      exit 1
    fi

    app_tree="$(lsblk -nr -o TYPE "$app_dev")" || {
      echo "Could not inspect APPDATA device children: $app_dev" >&2
      exit 1
    }
    app_children="$(printf '%s\n' "$app_tree" | sed -n '2,$p')"
    if [ -n "$app_children" ]; then
      echo "Refusing APPDATA device with child partitions: $app_dev" >&2
      exit 1
    fi

    app_fstype="$(blkid -p -s TYPE -o value "$app_dev" 2>/dev/null || true)"
    app_label="$(blkid -p -s LABEL -o value "$app_dev" 2>/dev/null || true)"
    app_pttype="$(blkid -p -s PTTYPE -o value "$app_dev" 2>/dev/null || true)"
    [ -z "$app_pttype" ] || {
      echo "Refusing APPDATA device with partition table type $app_pttype" >&2
      exit 1
    }

    if [ -z "$app_fstype" ]; then
      app_signatures="$(wipefs -n --noheadings -o TYPE "$app_dev")" || {
        echo "Could not inspect APPDATA signatures: $app_dev" >&2
        exit 1
      }
      if [ -n "$app_signatures" ]; then
        echo "Refusing APPDATA device with an unrecognized signature: $app_dev" >&2
        exit 1
      fi
      mkfs.ext4 -F -L APPDATA "$app_dev"
    elif [ "$app_fstype" != ext4 ] || [ "$app_label" != APPDATA ]; then
      echo "APPDATA must be ext4 with label APPDATA; found type=$app_fstype label=$app_label" >&2
      exit 1
    fi

    install -d -m 0755 /mnt/appdata
    install -d -m 0700 "$(dirname "$marker")"
    touch "$marker"

write_files:
  - path: /etc/ssh/sshd_config.d/99-harden.conf
    owner: root:root
    permissions: "0644"
    content: |
      PasswordAuthentication no
      PermitRootLogin no
      AuthenticationMethods publickey
      KbdInteractiveAuthentication no
      PermitUserEnvironment no
      AllowAgentForwarding no
      X11Forwarding no
      PrintLastLog yes
      MaxAuthTries 3
      LoginGraceTime 30s
      MaxSessions 5
      MaxStartups 10:30:100

  - path: /etc/sysctl.d/20-hardening.conf
    owner: root:root
    permissions: "0644"
    content: |
      kernel.kptr_restrict = 2
      kernel.yama.ptrace_scope = 1
      kernel.unprivileged_bpf_disabled = 1
      net.ipv4.conf.all.accept_redirects = 0
      net.ipv4.conf.default.accept_redirects = 0
      net.ipv4.conf.all.send_redirects = 0
      net.ipv4.conf.default.send_redirects = 0
      net.ipv4.conf.all.rp_filter = 2
      net.ipv4.conf.default.rp_filter = 2
      net.ipv4.tcp_syncookies = 1
      net.ipv6.conf.all.accept_redirects = 0
      net.ipv6.conf.default.accept_redirects = 0

  - path: /etc/sysctl.d/99-cloud-tuning.conf
    owner: root:root
    permissions: "0644"
    content: |
      vm.swappiness = 100
      vm.page-cluster = 0

  - path: /etc/fail2ban/jail.local
    owner: root:root
    permissions: "0644"
    content: |
      [DEFAULT]
      bantime = 30m
      findtime = 15m
      maxretry = 5
      bantime.increment = true
      bantime.factor = 4
      bantime.overalljails = true
      bantime.rndtime = 10m
      backend = systemd
      banaction = nftables-multiport
      banaction_allports = nftables-allports
      ignoreip = 127.0.0.1/8 ::1

      [sshd]
      enabled = true
      port = ssh
      filter = sshd[mode=aggressive]

  - path: /etc/apt/apt.conf.d/20auto-upgrades
    owner: root:root
    permissions: "0644"
    content: |
      APT::Periodic::Update-Package-Lists "1";
      APT::Periodic::Unattended-Upgrade "1";
      APT::Periodic::AutocleanInterval "7";

  - path: /etc/apt/apt.conf.d/52unattended-upgrades-local
    owner: root:root
    permissions: "0644"
    content: |
      Unattended-Upgrade::Origins-Pattern {
        "origin=Debian,codename=${distro_codename}-security,label=Debian-Security";
        "origin=Debian,codename=${distro_codename},label=Debian-Security";
      };
      Unattended-Upgrade::Remove-Unused-Dependencies "false";
      Unattended-Upgrade::Automatic-Reboot "false";
      Unattended-Upgrade::MinimalSteps "true";

  - path: /etc/apt/apt.conf.d/80-cloud-init-retries
    owner: root:root
    permissions: "0644"
    content: |
      Acquire::Retries "5";
      Acquire::http::Timeout "30";
      Acquire::https::Timeout "30";
      DPkg::Lock::Timeout "120";

  - path: /etc/systemd/zram-generator.conf
    owner: root:root
    permissions: "0644"
    content: |
      [zram0]
      zram-size = min(ram / 2, 512)
      compression-algorithm = zstd
      swap-priority = 150

