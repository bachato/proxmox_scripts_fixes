#cloud-config
# Generated by cloud-init/tools/render_profiles.py; edit the template, not this file.
# Profile: Debian 13 plain with remote syslog

output:
  all: "| tee -a /var/log/cloud-init-output.log"
final_message: "cloud-init modules finished after $UPTIME seconds; check cloud-init status --long"

preserve_hostname: false
manage_etc_hosts: true
timezone: America/Chicago

ssh_pwauth: false
disable_root: true

users:
  - name: admin
    gecos: Admin
    groups: [adm, sudo]
    shell: /bin/bash
    sudo: ALL=(ALL) NOPASSWD:ALL
    lock_passwd: true

write_files:
  - path: /etc/ssh/sshd_config.d/99-harden.conf
    owner: root:root
    permissions: "0644"
    content: |
      PasswordAuthentication no
      PermitRootLogin no
      AuthenticationMethods publickey
      KbdInteractiveAuthentication no
      PermitUserEnvironment no
      AllowAgentForwarding no
      X11Forwarding no
      PrintLastLog yes
      MaxAuthTries 3
      LoginGraceTime 30s
      MaxSessions 5
      MaxStartups 10:30:100

  - path: /etc/sysctl.d/20-hardening.conf
    owner: root:root
    permissions: "0644"
    content: |
      kernel.kptr_restrict = 2
      kernel.yama.ptrace_scope = 1
      kernel.unprivileged_bpf_disabled = 1
      net.ipv4.conf.all.accept_redirects = 0
      net.ipv4.conf.default.accept_redirects = 0
      net.ipv4.conf.all.send_redirects = 0
      net.ipv4.conf.default.send_redirects = 0
      net.ipv4.conf.all.rp_filter = 2
      net.ipv4.conf.default.rp_filter = 2
      net.ipv4.tcp_syncookies = 1
      net.ipv6.conf.all.accept_redirects = 0
      net.ipv6.conf.default.accept_redirects = 0

  - path: /etc/sysctl.d/99-cloud-tuning.conf
    owner: root:root
    permissions: "0644"
    content: |
      vm.swappiness = 100
      vm.page-cluster = 0

  - path: /etc/fail2ban/jail.local
    owner: root:root
    permissions: "0644"
    content: |
      [DEFAULT]
      bantime = 30m
      findtime = 15m
      maxretry = 5
      bantime.increment = true
      bantime.factor = 4
      bantime.overalljails = true
      bantime.rndtime = 10m
      backend = systemd
      banaction = nftables-multiport
      banaction_allports = nftables-allports
      ignoreip = 127.0.0.1/8 ::1

      [sshd]
      enabled = true
      port = ssh
      filter = sshd[mode=aggressive]

  - path: /etc/apt/apt.conf.d/20auto-upgrades
    owner: root:root
    permissions: "0644"
    content: |
      APT::Periodic::Update-Package-Lists "1";
      APT::Periodic::Unattended-Upgrade "1";
      APT::Periodic::AutocleanInterval "7";

  - path: /etc/apt/apt.conf.d/52unattended-upgrades-local
    owner: root:root
    permissions: "0644"
    content: |
      Unattended-Upgrade::Origins-Pattern {
        "origin=Debian,codename=${distro_codename}-security,label=Debian-Security";
        "origin=Debian,codename=${distro_codename},label=Debian-Security";
      };
      Unattended-Upgrade::Remove-Unused-Dependencies "false";
      Unattended-Upgrade::Automatic-Reboot "false";
      Unattended-Upgrade::MinimalSteps "true";

  - path: /etc/apt/apt.conf.d/80-cloud-init-retries
    owner: root:root
    permissions: "0644"
    content: |
      Acquire::Retries "5";
      Acquire::http::Timeout "30";
      Acquire::https::Timeout "30";
      DPkg::Lock::Timeout "120";

  - path: /etc/systemd/zram-generator.conf
    owner: root:root
    permissions: "0644"
    content: |
      [zram0]
      zram-size = min(ram / 2, 512)
      compression-algorithm = zstd
      swap-priority = 150

  - path: /etc/systemd/journald.conf.d/60-remote-syslog.conf
    owner: root:root
    permissions: "0644"
    content: |
      [Journal]
      Storage=volatile
      RuntimeMaxUse=64M
      ForwardToSyslog=no
      RateLimitIntervalSec=30s
      RateLimitBurst=5000

  # Replace every logs.example.invalid occurrence with the receiver's certificate name.
  - path: /etc/rsyslog.d/01-remote-tls.conf
    owner: root:root
    permissions: "0644"
    content: |
      global(
        DefaultNetstreamDriverCAFile="/etc/ssl/certs/ca-certificates.crt"
      )
      module(load="imjournal" StateFile="imjournal.state")

      action(
        type="omfwd"
        target="logs.example.invalid"
        port="6514"
        protocol="tcp"
        StreamDriver="ossl"
        StreamDriverMode="1"
        StreamDriverAuthMode="x509/name"
        StreamDriverPermittedPeers="logs.example.invalid"
        template="RSYSLOG_SyslogProtocol23Format"
        action.resumeRetryCount="-1"
        action.resumeInterval="30"
        queue.type="LinkedList"
        queue.filename="syslog-forward"
        queue.size="10000"
        queue.highWatermark="8000"
        queue.lowWatermark="2000"
        queue.maxDiskSpace="256m"
        queue.saveOnShutdown="on"
        queue.discardMark="9500"
        queue.discardSeverity="7"
      )

      # Do not continue into Debian's default on-disk /var/log actions.
      stop

  - path: /usr/local/sbin/cloud-init-report
    owner: root:root
    permissions: "0755"
    content: |
      #!/bin/bash
      set -u
      umask 077

      status="${1:-unknown}"
      exit_code="${2:-unknown}"
      failure_line="${3:-unknown}"
      log_dir=/home/admin/logs

      install -d -m 0700 -o admin -g admin "$log_dir"
      {
        printf 'bootstrap_status=%s\n' "$status"
        printf 'exit_code=%s\n' "$exit_code"
        printf 'failure_line=%s\n' "$failure_line"
        printf 'captured_at=%s\n' "$(date --iso-8601=seconds)"
        echo "### cloud-init status"
        cloud-init status --long || true
        echo "### cloud-init journal"
        journalctl -b -o short-iso --no-pager \
          -u cloud-init-local.service \
          -u cloud-init-network.service \
          -u cloud-config.service \
          -u cloud-final.service || true
        echo "### /var/log/cloud-init.log"
        [ ! -s /var/log/cloud-init.log ] || cat /var/log/cloud-init.log
        echo "### /var/log/cloud-init-output.log"
        [ ! -s /var/log/cloud-init-output.log ] || cat /var/log/cloud-init-output.log
      } > "$log_dir/cloud-init-full.log"

      {
        journalctl -b -o short-iso --no-pager -p warning \
          -u cloud-init-local.service \
          -u cloud-init-network.service \
          -u cloud-config.service \
          -u cloud-final.service || true
        [ ! -s /var/log/cloud-init.log ] || \
          grep -Ei "warning|error|critical|traceback|exception|failed" \
            /var/log/cloud-init.log || true
        [ ! -s /var/log/cloud-init-output.log ] || \
          grep -Ei "warning|error|critical|traceback|exception|failed" \
            /var/log/cloud-init-output.log || true
      } > "$log_dir/cloud-init-errors.log"

      chown -R admin:admin "$log_dir"
      chmod 0600 "$log_dir"/*.log

  - path: /usr/local/sbin/cloud-init-finalize
    owner: root:root
    permissions: "0755"
    content: |
      #!/bin/bash
      set -Eeuo pipefail

      success_marker=/var/lib/cloud/instance/boot-success
      rm -f "$success_marker"

      on_error() {
        local exit_code="$1"
        local failure_line="$2"
        trap - ERR
        /usr/local/sbin/cloud-init-report failure "$exit_code" "$failure_line" || true
        exit "$exit_code"
      }
      trap 'on_error "$?" "$LINENO"' ERR

      [ -d /home/admin ] || {
        echo "admin user was not created" >&2
        exit 1
      }
      install -d -m 0700 -o admin -g admin /home/admin/.ssh
      install -d -m 0700 -o admin -g admin /home/admin/apps
      chown -R admin:admin /home/admin
      chmod 0700 /home/admin

      [ -s /home/admin/.ssh/authorized_keys ] || {
        echo "No SSH key was supplied for admin through Proxmox cloud-init data" >&2
        exit 1
      }
      ssh-keygen -l -f /home/admin/.ssh/authorized_keys >/dev/null

      install -d -m 0755 /run/sshd
      /usr/sbin/sshd -t

      systemctl daemon-reload
      sysctl --system
      systemctl start dev-zram0.swap
      systemctl is-active --quiet dev-zram0.swap

      systemctl enable --now qemu-guest-agent.service
      systemctl is-active --quiet qemu-guest-agent.service

      systemctl enable --now unattended-upgrades.service
      systemctl is-active --quiet unattended-upgrades.service

      fail2ban-client -t
      systemctl enable --now fail2ban.service
      systemctl is-active --quiet fail2ban.service

      systemctl reload ssh.service
      systemctl is-active --quiet ssh.service
      systemctl enable --now fstrim.timer

      update-ca-certificates
      if grep -q "logs.example.invalid" /etc/rsyslog.d/01-remote-tls.conf; then
        echo "Replace logs.example.invalid with the remote syslog certificate name" >&2
        exit 1
      fi

      sed -i -E \
        's/^[[:space:]]*module\(load="imuxsock".*$/# disabled: using imjournal/; s/^[[:space:]]*module\(load="imklog".*$/# disabled: using imjournal/' \
        /etc/rsyslog.conf
      install -d -m 0700 -o root -g root /var/spool/rsyslog
      systemctl restart systemd-journald.service
      /usr/sbin/rsyslogd -N1
      systemctl enable --now rsyslog.service
      systemctl restart rsyslog.service
      systemctl is-active --quiet rsyslog.service
      logger -t cloud-init "remote syslog forwarding smoke test"

      install -d -m 0700 "$(dirname "$success_marker")"
      /usr/local/sbin/cloud-init-report success 0 0
      touch "$success_marker"
      trap - ERR

package_update: true
package_upgrade: true
package_reboot_if_required: false

packages:
  - ca-certificates
  - cloud-guest-utils
  - fail2ban
  - nftables
  - openssh-server
  - qemu-guest-agent
  - sudo
  - systemd-zram-generator
  - tmux
  - unattended-upgrades
  - rsyslog
  - rsyslog-openssl

growpart:
  mode: auto
resize_rootfs: true

runcmd:
  - [/usr/local/sbin/cloud-init-finalize]

power_state:
  mode: poweroff
  message: "cloud-init validated successfully; shutting down"
  delay: 1
  condition: [test, -f, /var/lib/cloud/instance/boot-success]
